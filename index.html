<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Seguridad: solo se ejecutan scripts de este sitio y de los CDN listados (nada en línea).
     Si Supabase usa un dominio propio (no *.supabase.co), hay que agregarlo en img-src, media-src y connect-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:9101; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Horus</title>
<meta name="description" content="Sistema de gestión Omega Eléctrica · Lafken Austral">
<meta name="theme-color" content="#1f5fbf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="css/horus.css">
</head>
<body>

<!-- Inicio de sesión -->
<section id="pantalla-login" class="centro" hidden>
  <form class="caja" id="form-login">
    <div class="login-top"><button class="ghost chico btn-tema" type="button" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro"></button></div>
    <div class="logo"><img src="icons/emblema.png" alt="">horus</div>
    <div class="empresas login-empresas"><img src="icons/omega.png" alt="Omega Eléctrica"><img src="icons/lafken.png" alt="Lafken Austral"></div>
    <label for="login-correo">Correo</label>
    <input id="login-correo" type="email" autocomplete="username" required>
    <label for="login-clave">Contraseña</label>
    <input id="login-clave" type="password" autocomplete="current-password" required>
    <div class="error-txt" id="login-error"></div>
    <button class="primary" type="submit" id="btn-entrar">Entrar</button>
  </form>
</section>

<!-- Pantalla pública (visitante con enlace / QR) -->
<section id="pantalla-publica" hidden>
  <header class="barra"><div class="barra-top">
    <div class="izq"><a class="marca" href="#/"><img src="icons/emblema.png" alt="">horus</a><span class="empresas"><img src="icons/omega.png" alt="Omega Eléctrica"><img src="icons/lafken.png" alt="Lafken Austral"></span></div>
    <div class="der"><button class="ghost chico btn-tema" type="button" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro"></button><a class="btn primary chico" href="#/login" id="btn-ir-login">Iniciar sesión</a></div>
  </div></header>
  <main id="publico"></main>
</section>

<!-- Mensajes (sin acceso, falta configurar, etc.) -->
<section id="pantalla-mensaje" class="centro" hidden><div class="caja" id="mensaje"></div></section>

<!-- Aplicación -->
<div id="app" hidden>
  <header class="barra">
    <div class="barra-top">
      <div class="izq"><a href="#/" class="marca"><img src="icons/emblema.png" alt="">horus</a><span class="empresas" id="empresas-app"></span></div>
      <div class="der">
        <button class="ghost chico btn-tema" type="button" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro"></button>
                <span class="quien" id="quien"></span>
        <button class="ghost chico" id="btn-instalar" hidden>Instalar app</button>
        <button class="ghost chico" id="btn-salir">Salir</button>
      </div>
    </div>
    <nav class="modulos" id="nav"></nav>
  </header>
  <main id="vista"></main>
</div>

<div id="etiqueta"></div>
<div id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
  integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
